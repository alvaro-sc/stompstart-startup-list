name: Illume
tagline: A health companion that connects wearable, meal, workout and lab data
description: >-
  Illume brings data from wearables, meals, workouts and lab results into one
  place. Its text-based companion answers questions using that context and
  points out patterns across the data. The company is inviting people to a
  private beta through its website.
problem: Health information is scattered across devices, tests and tracking apps.
audience:
  - People who track their health with wearables or lab tests
